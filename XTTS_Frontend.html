<style>

    font-family: Arial, sans-serif;

    padding: 10px;

h1 {

}

h2 {
    margin-top: 5px;
    margin-bottom: 10px;
}

h3 {
    margin-top: 10px;
    margin-bottom: 5px;

.section {

label {

textarea {

    height: 120px;
    resize: none;
    box-sizing: border-box;
}

#text_editor {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    box-sizing: border-box;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-family: inherit;
    font-size: inherit;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-y: auto;
    outline: none;
    background: white;
}

#text_editor:focus {
    border-color: #888;
}

#text_editor[contenteditable="false"] {
    background-color: #e8e8e8;
    color: #777;
    cursor: default;
}

#text_editor:empty::before {
    content: attr(placeholder);
    color: #aaa;
    pointer-events: none;
}

.sentence-too-long {
    background-color: rgba(220, 53, 69, 0.15);
    border-bottom: 2px solid #dc3545;
    border-radius: 2px;
}

input,
select,
button {
    width: 100%;
    max-width: 100%;
    padding: 8px;
    margin-top: 5px;
    box-sizing: border-box;
}


input:disabled,
textarea:disabled {

    color: #777;
}


.radio-option {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;

.radio-option input {

}


.settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}


button {
    margin-top: 10px;

}


audio {
    width: 100%;
    margin-top: 10px;

.combobox {

}


.speaker-list {

    overflow-y: auto;

.speaker-item {

.speaker-item:hover {

.left-column,
.middle-column,

.app-grid > div {

const XTTS_LIMIT = 253;

function highlightLongSentences(text){
    // Sätze aufteilen, zu lange rot markieren
    const parts = text.split(/(?<=[.!?])\s+/);
    return parts.map((sentence, i) => {
        const isLast = i === parts.length - 1;
        const suffix = isLast ? "" : " ";
        if(sentence.length > XTTS_LIMIT){
            return "<span class='sentence-too-long'>" +
                sentence.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") +
                "</span>" + suffix;
        }
        return sentence.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") + suffix;
    }).join("");
}

function getEditorText(){
    return textEditor.innerText || "";
}

// Cursor-Position merken und wiederherstellen
function saveCursor(){
    const sel = window.getSelection();
    if(!sel.rangeCount) return null;
    const range = sel.getRangeAt(0);
    const preRange = document.createRange();
    preRange.selectNodeContents(textEditor);
    preRange.setEnd(range.startContainer, range.startOffset);
    return preRange.toString().length;
}

function restoreCursor(pos){
    const walker = document.createTreeWalker(textEditor, NodeFilter.SHOW_TEXT);
    let node, remaining = pos;
    while((node = walker.nextNode())){
        if(remaining <= node.textContent.length){
            const range = document.createRange();
            const sel = window.getSelection();
            range.setStart(node, remaining);
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
            return;
        }
        remaining -= node.textContent.length;
    }
}

let isUpdating = false;

function updateEditorHighlight(){
    if(isUpdating) return;
    const text = getEditorText();
    const cursorPos = saveCursor();
    isUpdating = true;
    textEditor.innerHTML = highlightLongSentences(text);
    isUpdating = false;
    if(cursorPos !== null) restoreCursor(cursorPos);

    // Textarea synchron halten (wird für den fetch-Body verwendet)
    textArea.value = text;
    updateTextStats(text);
}

textEditor.addEventListener("input", updateEditorHighlight);

function generateFilename(name){

    let now = new Date();

    let timestamp =
        now.getFullYear() + "-" +
        String(now.getMonth()+1).padStart(2,"0") + "-" +
        String(now.getDate()).padStart(2,"0") + "_" +
        String(now.getHours()).padStart(2,"0") + "-" +
        String(now.getMinutes()).padStart(2,"0") + "-" +
        String(now.getSeconds()).padStart(2,"0");


    if(!name.toLowerCase().endsWith(".wav")){
        name += ".wav";
    }


    let base =
        name.substring(0, name.length - 4);


    return base + "_" + timestamp + ".wav";

}

async function loadJobs(){

    try {

        const response =
            await fetch(BACKEND + "/jobs");

        const newJobs =
            await response.json();

        const json =
            JSON.stringify(newJobs);

        if(json === lastJobs){
            return;
        }

        lastJobs = json;

        jobs = newJobs;

        updateEngineStatus();
        renderJobs();

    } catch(e) {
        // Backend nicht erreichbar – kein Fehler in der Konsole, Watchdog zeigt den Status
    }

}


function updateEngineStatus(){

    const el = document.getElementById("engineStatus");
    const text = document.getElementById("engineStatusText");
    const btn = document.getElementById("engineBtn");

    el.classList.remove("idle", "preparing", "rendering", "error", "stopped", "offline");

    // Wenn Watchdog nicht erreichbar
    if(engineContainerState === null){
        el.classList.add("offline");
        text.textContent = "Watchdog nicht erreichbar";
        btn.style.display = "none";
        return;
    }

    // Container werden gerade gestoppt
    if(engineContainerState === "stopping"){
        el.classList.add("preparing");
        text.textContent = "Engine stoppt...";
        btn.style.display = "none";
        return;
    }

    // Container gestoppt
    if(engineContainerState === "stopped"){
        el.classList.add("stopped");
        text.textContent = "Engine gestoppt";
        btn.textContent = "Starten";
        btn.className = "engine-btn start";
        btn.disabled = false;
        btn.style.display = "inline-block";
        return;
    }

    // Container fahren gerade hoch
    if(engineContainerState === "starting"){
        el.classList.add("preparing");
        text.textContent = "Engine startet...";
        btn.style.display = "none";
        return;
    }

    // Container laufen – jetzt Rendering-Status aus Jobliste
    const rendering = jobs.some(j => j.status === "Rendert");
    const preparing = jobs.some(j => j.status === "Wird vorbereitet");
    const errored = jobs.some(j => j.status === "Fehler");

    btn.textContent = "Stoppen";
    btn.className = "engine-btn stop";
    btn.disabled = false;
    btn.style.display = "inline-block";

    if(rendering){
        el.classList.add("rendering");
        text.textContent = "Rendert";
    } else if(preparing){
        el.classList.add("preparing");
        text.textContent = "Bereitet vor...";
    } else if(errored){
        el.classList.add("error");
        text.textContent = "Fehler aufgetreten";
    } else {
        el.classList.add("idle");
        text.textContent = "Bereit";
    }

}


async function pollWatchdog(){
    // Während eines laufenden Stop-Vorgangs nicht pollen –
    // toggleEngine setzt den Zustand nach dem await selbst korrekt.
    if(engineContainerState === "stopping") return;

    try {
        const r = await fetch(WATCHDOG + "/engine/status", { signal: AbortSignal.timeout(3000) });
        const data = await r.json();
        engineContainerState = data.engine;
    } catch(e) {
        engineContainerState = null;
    }
    updateEngineStatus();
}


async function toggleEngine(){
    const btn = document.getElementById("engineBtn");
    btn.disabled = true;

    if(engineContainerState === "stopped"){
        btn.textContent = "Startet...";
        await fetch(WATCHDOG + "/engine/start", { method: "POST" });
        engineContainerState = "starting";
    } else {
        btn.textContent = "Stoppt...";
        engineContainerState = "stopping";
        updateEngineStatus();
        await fetch(WATCHDOG + "/engine/stop", { method: "POST" });
        engineContainerState = "stopped";
    }

    updateEngineStatus();
}

    if(expandedJobs.has(jobId)){

    }

}


async function downloadAudio(url, filename){

    try {

        const response = await fetch(url);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        URL.revokeObjectURL(blobUrl);

    } catch (err) {
        console.error("Download fehlgeschlagen:", err);
        alert("Download fehlgeschlagen. Siehe Konsole für Details.");
    }

}

function moveJobUp(jobId){

    let index = jobs.findIndex(
        job => job.id === jobId
    );


    if(index <= 0){
        return;
    }


    let movedJob = jobs[index];


    let temp = jobs[index];

    jobs[index] = jobs[index - 1];

    jobs[index - 1] = temp;


    renderJobs();


    let element = [...document.querySelectorAll(".job-item")]
        .find(el => el.innerHTML.includes("ID: " + movedJob.id));


if(element){

    element.classList.add("highlight");

    setTimeout(()=>{

        element.classList.remove("highlight");

    },2500);

}

}



function moveJobDown(jobId){

    let index = jobs.findIndex(
        job => job.id === jobId
    );


    if(index === -1 || index >= jobs.length - 1){
        return;
    }


    let movedJob = jobs[index];


    let temp = jobs[index];

    jobs[index] = jobs[index + 1];

    jobs[index + 1] = temp;


    renderJobs();


    let element = [...document.querySelectorAll(".job-item")]
        .find(el => el.innerHTML.includes("ID: " + movedJob.id));


 if(element){

    element.classList.add("highlight");

    setTimeout(()=>{

        element.classList.remove("highlight");

    },2500);

}

}

function updateTextStats(text, filename="-") {

    let chars = text.length;

    let words = text
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .length;

    let paragraphs = text
        .split(/\n+/)
        .filter(line => line.trim() !== "")
        .length;

    // Längsten Satz ermitteln (gleiche Logik wie im xtts_server.py)
    const sentences = text
        .trim()
        .split(/(?<=[.!?])\s+/)
        .map(s => s.trim())
        .filter(Boolean);

    const longestSentence = sentences.length > 0
        ? Math.max(...sentences.map(s => s.length))
        : chars;

    const overLimit = longestSentence > XTTS_LIMIT;

    const longestHtml = overLimit
        ? "<span style='color:#dc3545; font-weight:600;'>" + longestSentence + "/" + XTTS_LIMIT + " ⚠</span>"
        : "<span style='color:#2ecc71;'>" + longestSentence + "/" + XTTS_LIMIT + "</span>";

    textStats.innerHTML =
    "Datei: " + filename +
    "<br>Zeichen: " + chars +
    "<br>Längster Satz: " + longestHtml +
    "<br>Wörter: " + words +
    "<br>Absätze: " + paragraphs;

}
