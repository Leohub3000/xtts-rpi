services:
  watchdog:
    build:
      context: ./docker
      dockerfile: Dockerfile.watchdog
    container_name: xtts_watchdog
    restart: always
    environment:
      - COMPOSE_DIR=/compose
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
      - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins
      - /mnt/data/tts/coqui:/compose
    ports:
      - "8012:8012"

  xtts:
    build:
      context: ./docker
      dockerfile: Dockerfile.xtts
    image: coqui-xtts:latest
    container_name: xtts
    restart: "no"
    expose:
      - "8010"
    volumes:
      - /mnt/data/tts/models:/root/.local/share/tts
      - /mnt/data/tts/output:/output

  backend:
    build:
      context: ../backend
    image: coqui-backend:latest
    container_name: xtts_backend
    restart: "no"
    depends_on:
      - xtts
    environment:
      - XTTS_URL=http://xtts:8010
      - BACKEND_CALLBACK_URL=http://backend:8000
    volumes:
      - /mnt/data/tts/backend:/app
      - /mnt/data/tts/output:/output
      - /mnt/data/tts/voices:/voices
    ports:
      - "8011:8000"
